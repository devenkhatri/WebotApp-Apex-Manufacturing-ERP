name: apex-erp

services:
  app:
    build:
      context: .
      target: app
    container_name: apex_erp_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
      - apex_public_build:/var/www/html/public/build
    environment:
      AUTORUN_MIGRATIONS: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-apex_erp}
      DB_USERNAME: ${DB_USERNAME:-apex_user}
      DB_PASSWORD: ${DB_PASSWORD:-apex_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apex_network

  web:
    image: nginx:alpine
    container_name: apex_erp_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - apex_public_build:/var/www/html/public/build:ro
    depends_on:
      - app
    networks:
      - apex_network

  db:
    image: mysql:8.0
    container_name: apex_erp_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-apex_erp}
      MYSQL_USER: ${DB_USERNAME:-apex_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apex_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-apex_root_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - apex_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-apex_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - apex_network

  redis:
    image: redis:alpine
    container_name: apex_erp_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - apex_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - apex_network

  queue:
    build:
      context: .
      target: app
    container_name: apex_erp_queue
    restart: unless-stopped
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    environment:
      AUTORUN_MIGRATIONS: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-apex_erp}
      DB_USERNAME: ${DB_USERNAME:-apex_user}
      DB_PASSWORD: ${DB_PASSWORD:-apex_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apex_network

networks:
  apex_network:
    driver: bridge

volumes:
  apex_db_data:
    driver: local
  apex_redis_data:
    driver: local
  apex_public_build:
    driver: local
